# Production: every merge into main builds, runs the page checks (links, JS errors, overflow, reduced motion, idle cost,
# accessibility) and publishes the site to GitHub Pages (docs/08-kaizen-go-live.md · D10, D14, D74). The typography and
# design checks run on the pull request, not again here: main only takes pull requests that passed them (D74).
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NB_BASE: /no_babysitting_anymore/
  NB_SITE: https://no-babysitting.github.io
  PW_VERSION: '1.63.0'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for the checks
        run: |
          npm i --no-save playwright@${{ env.PW_VERSION }} axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Checks (links, JS errors, overflow, reduced motion, idle cost)
        run: node scripts/check.cjs
      - name: Record which commit is published (dist/build.json, issue #33)
        run: |
          printf '{"sha":"%s","short":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build.json
          cat dist/build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
