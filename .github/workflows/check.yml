# Every pull request: the same build and checks as production, without publishing.
# Claude merges a PR only when this is green (docs/08-kaizen-go-live.md · D14).
name: Check site

on:
  pull_request:
  workflow_dispatch:

env:
  NB_BASE: /no_babysitting_anymore/
  NB_SITE: https://no-babysitting.github.io

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for the checks
        run: |
          npm i --no-save playwright@1.63.0 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Checks (links, JS errors, overflow, reduced motion, idle cost)
        run: node scripts/check.cjs
      - name: Typography self-test (the checker still catches what it should)
        run: node scripts/type-check.cjs --selftest
      - name: Typography (contrast, sizes, Vietnamese marks, text spacing, zoom, fonts)
        run: node scripts/type-check.cjs
      - name: Design lint (overlap, clipping, tap size, holds, demos start when seen)
        run: node scripts/design-check.cjs --shots design-report
      - name: Art lock (the signed-off ASCII art has not drifted; docs/19 §2, D55)
        run: node scripts/art-check.cjs --shots art-report
      - name: Art report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-report
          path: site/art-report
          if-no-files-found: ignore
      - name: Design report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-report
          path: site/design-report
          if-no-files-found: ignore
      - name: Typography report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-report
          path: site/type-report
          if-no-files-found: ignore
      - name: Contrast of the design tokens
        working-directory: .
        run: python3 tools/contrast.py design-system/tokens.json --fail
