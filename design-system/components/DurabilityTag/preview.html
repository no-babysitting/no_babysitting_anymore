<!-- @dsCard group="Nhãn" height=230 subtitle="4 mức độ bền · viền + ký hiệu + chữ (không chỉ màu) · góc vuông, mono hoa" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>DurabilityTag</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  html,body{margin:0}
  body{background:var(--bg);padding:20px}
  .dt{padding:44px 0 0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--control)}
  .grid > div{padding:16px 16px 18px;border-right:1px solid var(--control);display:grid;gap:10px;align-content:start}
  .grid > div:last-child{border-right:0}
  .grid p{margin:0;font-size:13px;line-height:1.5;color:var(--fg-muted)}
  .k{color:var(--fg-subtle)}
  @media (max-width:640px){.grid{grid-template-columns:1fr 1fr}.grid > div{border-bottom:1px solid var(--control)}}
</style>
</head>
<body>
<section class="nb nb-frame dt" aria-label="Nhãn độ bền">
  <span class="nb-corner tl nb-micro"><span class="nb-sq"></span>DurabilityTag · 4 mức</span>
  <span class="nb-corner tr nb-micro">kind</span>
  <div class="grid">
    <div><span><span class="nb-tag is-signal"><span aria-hidden="true">◆</span>Bền vững</span></span><p>Đúng qua nhiều thế hệ model.</p><span class="nb-micro k">timeless</span></div>
    <div><span><span class="nb-tag is-warn"><span aria-hidden="true">◐</span>Phụ thuộc model</span></span><p>Đúng hôm nay, nên xem lại khi model đổi.</p><span class="nb-micro k">model-sensitive</span></div>
    <div><span><span class="nb-tag is-danger"><span aria-hidden="true">✕</span>Đã thay thế</span></span><p>Đã có cách tốt hơn; giữ để hiểu lịch sử.</p><span class="nb-micro k">superseded</span></div>
    <div><span><span class="nb-tag is-info"><span aria-hidden="true">⇄</span>Chưa thống nhất</span></span><p>Các nguồn uy tín nói khác nhau.</p><span class="nb-micro k">contested</span></div>
  </div>
</section>
</body>
</html>
