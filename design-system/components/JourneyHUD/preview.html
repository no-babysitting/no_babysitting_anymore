<!-- @dsCard group="HUD" height=560 subtitle="JourneyHUD · thanh trên 48px · cấp độ Low → Pro · bản đồ harness 6 phần (PRD G1) · báo cáo tuần ■■□□ · chương n/12 · mở rộng khi bấm" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>JourneyHUD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  html,body{margin:0}
  body{background:var(--bg);padding:20px}
  .jh{padding:44px 0 0}
  .hud{display:flex;align-items:stretch;height:var(--hud-height);border-top:1px solid var(--control);border-bottom:1px solid var(--control);background:var(--bg)}
  .hud > *{display:flex;align-items:center;gap:10px;padding:0 14px;border-right:1px solid var(--control);min-width:0}
  .hud > *:last-child{border-right:0;margin-left:auto}
  .wm{flex:none}
  .wm .nb-logo{width:208px}
  .lvl{gap:10px}
  .lvbar{display:grid;grid-template-columns:repeat(4,22px);gap:3px}
  .lvbar i{height:10px;background:transparent;border:1px solid var(--control)}
  .lvbar i.on.l1{background:var(--level-1);border-color:var(--level-1)} .lvbar i.on.l2{background:var(--level-2);border-color:var(--level-2)}
  .lvbar i.on.l3{background:var(--level-3);border-color:var(--level-3)} .lvbar i.on.l4{background:var(--level-4);border-color:var(--level-4)}
  .lvname{font:600 12px/1 var(--font-mono);color:var(--fg);letter-spacing:.08em;min-width:6.5ch}
  .hm{display:flex;gap:3px}
  .hm i{display:block;width:11px;height:11px;border:1px solid var(--control)}
  .hm i.on{background:var(--fg);border-color:var(--fg)}
  .sb{font:600 13px/1 var(--font-mono);letter-spacing:.18em;color:var(--fg)}
  .pos b{font:600 13px/1 var(--font-mono);color:var(--fg)}
  .toggle{appearance:none;background:transparent;border:0;color:var(--fg);font:600 12.5px/1 var(--font-mono);letter-spacing:.04em;cursor:pointer;padding:0 14px;height:100%}
  .toggle:hover{background:var(--fg);color:var(--bg)}
  .toggle:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-2px}
  .panel{display:none;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;border-bottom:1px solid var(--control)}
  .panel.on{display:grid}
  .panel > div{padding:16px 18px;display:grid;gap:10px;align-content:start}
  .panel > div + div{border-left:1px solid var(--control)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:7px 14px 7px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
  th{font:600 12px/1.3 var(--font-mono);color:var(--fg-muted);letter-spacing:.04em}
  td.g{font:600 13px/1 var(--font-mono);width:2.4ch}
  tr.on td{color:var(--fg)} tr.off td{color:var(--fg-subtle)}
  tr.on td.g{color:var(--signal)}
  .crit{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
  .crit li{display:grid;grid-template-columns:3.5ch 1fr;gap:6px;color:var(--fg-subtle)}
  .crit li.ok{color:var(--fg)} .crit li.ok .m{color:var(--signal)}
  .crit .m{font:600 13px/1.4 var(--font-mono)}
  .demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 18px}
  .demo .nb-micro{margin-left:auto}
  th{white-space:nowrap}
  .hud .nb-micro{white-space:nowrap}
  @media (max-width:1100px){.hud .hmw > .nb-micro,.hud .sbw > .nb-micro{display:none}}
  .pos,.toggle{white-space:nowrap}
  @media (max-width:760px){
    .hud .hmw,.hud .sbw,.wm{display:none}
    .hud > *{padding:0 10px}
    .toggle{padding:0 10px}
    .lvbar{grid-template-columns:repeat(4,14px)}
    thead{display:none}
    tbody tr{display:grid;grid-template-columns:2.4ch 1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
    tbody td{border:0;padding:0}
    tbody td:nth-child(4){grid-column:2 / -1;font-size:13.5px}
    .panel{grid-template-columns:1fr}
    .panel > div + div{border-left:0;border-top:1px solid var(--control)}
  }
</style>
</head>
<body>
<section class="nb nb-frame jh" aria-labelledby="jt">
  <span class="nb-corner tl nb-micro" id="jt"><span class="nb-sq"></span>JourneyHUD · thanh trên</span>
  <span class="nb-corner tr nb-micro">cao 48px · dính đầu trang</span>

  <header class="hud" aria-label="Tiến độ học">
    <span class="wm" id="wm"></span>
    <div class="lvl" role="progressbar" id="pb" aria-label="Cấp độ" aria-valuemin="1" aria-valuemax="12" aria-valuenow="4" aria-valuetext="MEDIUM, chương 4 trên 12">
      <span class="lvbar" aria-hidden="true"><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i></span>
      <span class="lvname" id="lvname" aria-hidden="true">MEDIUM</span>
    </div>
    <div class="hmw" title="Harness: phần đã hiểu"><span class="nb-micro">Harness</span><span class="hm" id="hm" role="img" aria-label=""></span></div>
    <div class="sbw" title="Báo cáo tuần: tiêu chí đã đạt"><span class="nb-micro">Báo cáo tuần</span><span class="sb" id="sb" role="img" aria-label=""></span></div>
    <div class="pos"><span class="nb-micro"><b id="cid">c03</b> · <span id="cno">4</span>/12</span></div>
    <button class="toggle" type="button" id="tg" aria-expanded="false" aria-controls="panel">[ Chi tiết ]</button>
  </header>

  <div class="panel" id="panel">
    <div>
      <span class="nb-micro">Bản đồ harness · 6 phần</span>
      <table>
        <thead><tr><th scope="col"><span class="nb-sr">Trạng thái</span></th><th scope="col">Phần</th><th scope="col">Mở ở</th><th scope="col">Bạn sẽ biết</th></tr></thead>
        <tbody id="hmRows"></tbody>
      </table>
    </div>
    <div>
      <span class="nb-micro">Báo cáo tuần · 4 tiêu chí</span>
      <ul class="crit" id="crit"></ul>
    </div>
  </div>

  <div class="demo">
    <button class="nb-btn" type="button" id="back">Lùi một chương</button>
    <button class="nb-btn" type="button" id="next">Hoàn thành chương</button>
    <span class="nb-micro">nút chỉ có trong preview</span>
  </div>
  <p class="nb-sr" id="live" aria-live="polite"></p>
</section>
<script>
(function () {
  var NB = window.NoBabysitting; if (!NB) return;
  var IDS = ['c00', 'c01', 'c02', 'c03', 'c04', 'c05', 'c05b', 'c06', 'c07', 'c08', 'c09', 'c10'];
  var LEVEL = [0, 0, 0, 1, 1, 2, 2, 2, 2, 3, 3, 3], LV = ['LOW', 'MEDIUM', 'HIGH', 'PRO'];
  /* the six harness parts are PRD G1's mental model: context, plan, memory, building blocks, guardrails, verification */
  var HARNESS = [
    ['Context', 'c02', 2, 'Hội thoại tập trung cho kết quả tốt hơn, rẻ hơn'],
    ['Kế hoạch', 'c03', 3, 'Brief, plan, để Claude phỏng vấn mình'],
    ['Trí nhớ', 'c04', 4, 'Hướng dẫn dự án gọn, chủ yếu là gotcha'],
    ['Khối xây dựng', 'c05', 5, 'Skill, command, subagent; chọn model và effort'],
    ['Rào chắn', 'c06', 7, 'Quyền, connector, hook'],
    ['Kiểm chứng', 'c07', 8, 'Đối chiếu số liệu, reviewer độc lập']
  ];
  var CRIT = [['Hiểu đúng yêu cầu', 3], ['Đúng chuẩn trình bày của team', 4], ['Số liệu được kiểm chứng', 8], ['Lặp lại được và tự chạy', 10]];
  var done = 3, $ = function (id) { return document.getElementById(id); }, anim = window.gsap && !NB.reduce();
  $('wm').innerHTML = NB.logoSVG('sm'); $('wm').firstChild.classList.add('is-mono');
  HARNESS.forEach(function (h) {
    var tr = document.createElement('tr'); tr.innerHTML = '<td class="g"></td><td></td><td class="nb-mono"></td><td></td>';
    tr.children[1].textContent = h[0]; tr.children[2].textContent = h[1]; tr.children[3].textContent = h[3]; $('hmRows').appendChild(tr);
    var i = document.createElement('i'); $('hm').appendChild(i);
  });
  CRIT.forEach(function (c, k) { var li = document.createElement('li'); li.innerHTML = '<span class="m"></span><span></span>'; li.lastChild.textContent = (k + 1) + '. ' + c[0]; $('crit').appendChild(li); });
  function sync(changed) {
    var cur = Math.min(done, 11), lv = LEVEL[cur];
    document.querySelectorAll('.lvbar i').forEach(function (i, k) { i.classList.toggle('on', k <= lv); });
    $('lvname').textContent = LV[lv];
    var hOn = 0;
    [].forEach.call($('hmRows').children, function (tr, k) {
      var on = done > HARNESS[k][2]; if (on) hOn++;
      tr.className = on ? 'on' : 'off'; tr.firstChild.textContent = on ? '✓' : '·';
      $('hm').children[k].className = on ? 'on' : '';
    });
    $('hm').setAttribute('aria-label', 'Harness: đã mở ' + hOn + ' trên 6 phần');
    var cOn = 0;
    [].forEach.call($('crit').children, function (li, k) { var ok = done > CRIT[k][1]; if (ok) cOn++; li.className = ok ? 'ok' : ''; li.firstChild.textContent = ok ? '[✓]' : '[ ]'; });
    $('sb').textContent = '■■■■'.slice(0, cOn) + '□□□□'.slice(cOn);
    $('sb').setAttribute('aria-label', 'Báo cáo tuần: đạt ' + cOn + ' trên 4 tiêu chí');
    $('cid').textContent = IDS[cur]; $('cno').textContent = cur + 1;
    $('pb').setAttribute('aria-valuenow', String(cur + 1)); $('pb').setAttribute('aria-valuetext', LV[lv] + ', chương ' + (cur + 1) + ' trên 12');
    if (changed) {
      $('live').textContent = 'Đang ở ' + IDS[cur] + ', cấp độ ' + LV[lv] + '. Harness ' + hOn + '/6, báo cáo tuần ' + cOn + '/4.';
    }
  }
  $('tg').addEventListener('click', function () {
    var on = $('panel').classList.toggle('on'); $('tg').setAttribute('aria-expanded', String(on)); $('tg').textContent = on ? '[ Thu gọn ]' : '[ Chi tiết ]';
    if (on && anim) gsap.from('#panel', { autoAlpha: 0, y: -6, duration: 0.24, ease: 'power3.out' });
  });
  $('next').addEventListener('click', function () { done = done >= 12 ? 0 : done + 1; sync(true); });
  $('back').addEventListener('click', function () { done = Math.max(0, done - 1); sync(true); });
  sync(false);
})();
</script>
</body>
</html>
