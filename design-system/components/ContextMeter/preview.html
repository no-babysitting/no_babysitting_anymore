<!-- @dsCard group="Simulator" height=470 subtitle="S1 · ngân sách context · số condensed khổng lồ + thanh khối ASCII · đồng nghiệp quá tải khi vượt 60%" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ContextMeter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  html,body{margin:0}
  body{background:var(--bg);padding:20px}
  .cm{padding:46px 18px 16px;display:grid;gap:14px}
  .hero{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end}
  .num{margin:0;font-size:clamp(96px,16vw,150px);color:var(--fg);transition:color .2s}
  .cm[data-zone="warn"] .num,.cm[data-zone="warn"] .fill{color:var(--warn)}
  .cm[data-zone="bad"] .num,.cm[data-zone="bad"] .fill{color:var(--danger)}
  .side{display:grid;gap:10px;padding-bottom:8px}
  .state{margin:0;font:600 15px/1.4 var(--font-text)}
  .face{font:600 15px/1 var(--font-mono);letter-spacing:0}
  .log{list-style:none;margin:0;padding:0;font:400 12.5px/1.5 var(--font-mono);color:var(--fg-subtle);min-height:3em}
  .log li:last-child{color:var(--fg)}
  .meter{font:500 15px/1 var(--font-mono);letter-spacing:0;white-space:pre;overflow:hidden}
  .rul{position:relative;height:30px;font:600 10px/1.2 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
  .rul span{position:absolute;top:0;border-left:1px solid var(--fg-muted);padding:10px 0 0 6px;white-space:nowrap}
  .fill{color:var(--signal)} .empty{color:var(--control)}
    .btns{display:flex;flex-wrap:wrap;gap:8px}
  .btns .nb-btn{padding:9px 11px;font-size:11px}
  .src{margin:0;font-size:12.5px;color:var(--fg-subtle);line-height:1.5;max-width:76ch}
  @media (max-width:640px){.hero{grid-template-columns:1fr}.rul span{font-size:8.5px}}
</style>
</head>
<body>
<section class="nb nb-frame cm" id="cm" data-zone="ok" aria-labelledby="cmt">
  <span class="nb-corner tl nb-micro" id="cmt"><span class="nb-sq"></span>S1 · Context của phiên báo cáo tuần</span>
  <span class="nb-corner tr nb-micro">mô phỏng · <b>c02</b></span>
  <div class="hero">
    <p class="nb-cond num nb-tabular" id="num" aria-hidden="true">08%</p>
    <div class="side">
      <span class="nb-micro">Đồng nghiệp <span class="face" id="col">[•_•]</span></span>
      <p class="state" id="state" aria-live="polite">✓ Vùng an toàn</p>
      <ol class="log" id="log" aria-hidden="true"><li>› Mở phiên · brief 1 trang</li></ol>
    </div>
  </div>
  <div role="meter" id="meter" aria-label="Mức dùng context" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8" aria-valuetext="8%, vùng an toàn">
    <div class="meter" aria-hidden="true"><span class="fill" id="fill"></span><span class="empty" id="empty"></span></div>
    <div class="rul" aria-hidden="true"><span style="left:40%">40 · dumb zone</span><span style="left:60%">60 · nên kết thúc</span></div>
  </div>
  <div class="btns">
    <button class="nb-btn" type="button" data-d="18" data-l="Đọc 12 file Excel">+ 12 file Excel</button>
    <button class="nb-btn" type="button" data-d="11" data-l="Tra 6 trang web">+ 6 trang web</button>
    <button class="nb-btn" type="button" data-d="9" data-l="Bản nháp hỏng + lời sửa">+ Nháp hỏng</button>
    <button class="nb-btn" type="button" data-d="-20" data-l="Tua lại trước lần hỏng">⟲ Tua lại</button>
    <button class="nb-btn is-solid" type="button" data-reset="1" data-l="Phiên mới + brief">Phiên mới + brief</button>
  </div>
  <p class="src">Ngưỡng 40% theo Dex (video 24/03/2026); nguồn khác đưa ngưỡng khác, xem "Chưa thống nhất". Số tiêu hao là minh hoạ.</p>
</section>
<script>
(function () {
  var NB = window.NoBabysitting; if (!NB) return;
  var W = 50, v = 8, shown = { v: 8 }, anim = window.gsap && !NB.reduce();
  var cm = document.getElementById('cm'), num = document.getElementById('num'), fill = document.getElementById('fill'), empty = document.getElementById('empty');
  var meter = document.getElementById('meter'), state = document.getElementById('state'), log = document.getElementById('log');
  var col = NB.colleague(document.getElementById('col'), 'idle');
  var mt = fill.parentNode;
  function fit() { mt.style.fontSize = '100px'; var w = mt.getBoundingClientRect().width, cw = fill.textContent.length + empty.textContent.length; var probe = mt.scrollWidth / Math.max(1, cw); mt.style.fontSize = Math.max(9, Math.min(30, 100 * w / (probe * W) * 0.995)) + 'px'; }
  window.addEventListener('resize', fit);
  function paint(x) {
    var f = Math.round(x / 100 * W);
    fill.textContent = new Array(f + 1).join('█'); empty.textContent = new Array(W - f + 1).join('░');
    num.textContent = (x < 10 ? '0' : '') + Math.round(x) + '%';
  }
  function render(label) {
    var s, z, face;
    if (v < 40) { s = '✓ Vùng an toàn'; z = 'ok'; face = 'working'; }
    else if (v < 60) { s = '◐ Dumb zone: chất lượng bắt đầu giảm'; z = 'warn'; face = 'thinking'; }
    else { s = '✕ Nên kết thúc: tua lại, nén có gợi ý, hoặc mở phiên mới'; z = 'bad'; face = 'overloaded'; }
    cm.dataset.zone = z; state.textContent = s; col.set(v <= 8 ? 'idle' : face);
    meter.setAttribute('aria-valuenow', String(v)); meter.setAttribute('aria-valuetext', v + '%, ' + s.slice(2));
    if (label) { var li = document.createElement('li'); li.textContent = '› ' + label; log.appendChild(li); while (log.children.length > 3) log.removeChild(log.firstChild); }
    if (anim) gsap.to(shown, { v: v, duration: 0.5, ease: 'steps(12)', onUpdate: function () { paint(shown.v); } });
    else paint(v);
  }
  document.querySelectorAll('[data-l]').forEach(function (b) {
    b.addEventListener('click', function () {
      var d = Number(b.dataset.d || 0);
      v = b.dataset.reset ? 6 : Math.max(0, Math.min(100, v + d));
      render((d > 0 ? '+' + d + '% ' : '') + b.dataset.l);
    });
  });
  paint(v); fit();
})();
</script>
</body>
</html>
