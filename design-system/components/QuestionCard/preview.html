<!-- @dsCard group="Story" height=340 subtitle="Câu hỏi Socratic mở chương · serif duy nhất của hệ · M5 tách từ + M4 nhãn decode" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>QuestionCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrambleTextPlugin.min.js"></script>
<style>
  html,body{margin:0}
  body{background:var(--bg);padding:20px}
  .qc{min-height:296px;display:grid;grid-template-rows:1fr auto;padding:56px 22px 16px}
  .ghost{right:-2%;bottom:-6%;font-size:240px}
  .q{position:relative;z-index:1;margin:0;max-width:22ch;font-size:clamp(28px,4.4vw,44px);align-self:center;color:var(--fg)}
  .q .c-accent{color:var(--accent)}
  .foot{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;border-top:1px solid var(--control);padding-top:12px}
  .face{font-size:13px;letter-spacing:0;margin-left:6px}
  .hint{color:var(--fg-subtle)}
  @media (max-width:640px){.ghost{font-size:150px}}
</style>
</head>
<body>
<section class="nb nb-frame nb-dots qc" aria-labelledby="q">
  <span class="nb-corner tl nb-micro"><span class="nb-sq"></span><span id="eb">Chương 04 · Hỏi</span></span>
  <span class="nb-corner tr nb-micro"><b>05</b> / 12 · beat 1</span>
  <span class="nb-ghost ghost" aria-hidden="true">Memory</span>
  <h2 class="nb-q q" id="q">Tuần nào bạn cũng phải nhắc lại cùng một quy ước. Vì sao Claude không nhớ<span class="c-accent">?</span></h2>
  <div class="foot">
    <span class="nb-micro">Đồng nghiệp<span class="nb-mono face" id="col">[•_•]?</span></span>
    <span class="nb-micro hint">Trả lời trong đầu trước khi cuộn · không có đáp án sai</span>
    <button class="nb-btn" id="replay" type="button">Phát lại</button>
  </div>
</section>
<script>
(function () {
  var NB = window.NoBabysitting; if (!NB) return;
  var col = NB.colleague(document.getElementById('col'), 'asking');
  if (NB.reduce() || !window.gsap || !window.SplitText) return;
  gsap.registerPlugin(SplitText); if (window.ScrambleTextPlugin) gsap.registerPlugin(ScrambleTextPlugin);
  var tl;
  document.fonts.ready.then(function () {
    var split = SplitText.create('#q', { type: 'words', mask: 'words' });
    tl = gsap.timeline();
    tl.call(function () { col.set('thinking', true); NB.say(document.getElementById('eb'), 'Chương 04 · hỏi'); })
      .from('.ghost', { xPercent: 6, autoAlpha: 0, duration: 1.2, ease: 'power2.out' }, 0)
      .from(split.words, { yPercent: 110, duration: 0.5, ease: 'power3.out', stagger: 0.04 }, 0.15)
      .call(function () { col.set('asking'); }, null, '-=0.1');
  });
  document.getElementById('replay').addEventListener('click', function () { if (tl) tl.restart(); });
})();
</script>
</body>
</html>
