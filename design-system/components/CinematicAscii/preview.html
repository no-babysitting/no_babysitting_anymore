<!-- @dsCard group="ASCII" height=600 subtitle="Cảnh full-color (finale) · màu lấy từ ảnh · tiêu đề và metadata kiểu điện ảnh" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>CinematicAscii</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrambleTextPlugin.min.js"></script>
<style>
  html,body{margin:0}
  body{background:var(--bg);padding:20px}
  .cin{height:540px;cursor:crosshair}
  .cv{position:absolute;inset:0}
  .shade{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to bottom,transparent,var(--bg) 88%);pointer-events:none;z-index:2}
  .meta{position:absolute;left:14px;right:14px;bottom:14px;z-index:3;display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:end}
  .meta h2{margin:0;font-size:clamp(30px,6vw,60px);grid-column:1/-1}
  dl{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0}
  dl div{display:grid;gap:2px} dt{color:var(--fg-subtle)} dd{margin:0;color:var(--fg)}
  .face{font-size:14px;letter-spacing:0}
</style>
</head>
<body>
<section class="nb nb-frame cin" id="cin" aria-labelledby="ct">
  <canvas class="nb-canvas cv" id="cv" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>
  <span class="nb-corner tl nb-micro"><span class="nb-sq is-signal"></span>FINALE · FULL-COLOR</span>
  <span class="nb-corner tr nb-micro"><b>10</b> / 10</span>
  <div class="meta">
    <h2 class="nb-wide" id="ct">No Babysitting</h2>
    <dl class="nb-micro">
      <div><dt>Người giao</dt><dd>Bạn</dd></div>
      <div><dt>Chế độ</dt><dd>AFK</dd></div>
      <div><dt>Lịch</dt><dd>Thứ Hai · 08:00</dd></div>
      <div><dt>Đã đối chiếu</dt><dd class="nb-tabular" id="n">00 / 14</dd></div>
    </dl>
    <span class="nb-micro">Đồng nghiệp <span class="nb-mono face" id="col">[>_<]≡</span></span>
  </div>
  <p class="nb-sr">Cảnh kết: một đường chân trời lúc hoàng hôn dựng bằng ký tự màu. Bạn đã rời bàn, việc vẫn tự chạy và tự kiểm chứng.</p>
</section>
<script>
(function () {
  var NB = window.NoBabysitting; if (!NB) return;
  if (window.gsap && window.ScrambleTextPlugin) gsap.registerPlugin(ScrambleTextPlugin);
  var A = NB.ascii(document.getElementById('cv'), {
    host: document.getElementById('cin'), cell: [8, 14], mode: 'color', order: 0, sweep: 0.4, noiseFill: 0.35,
    font: '500 12px "JetBrains Mono", ui-monospace, monospace', lensColor: 'fg', lensPx: 120,
    source: NB.sources.scene({ sunX: 0.68 })
  });
  var col = NB.colleague(document.getElementById('col'), 'working');
  var n = document.getElementById('n'), cnt = { v: 0 };
  function pad(v) { return (v < 10 ? '0' : '') + v; }
  A.ready.then(function () {
    if (NB.reduce() || !window.gsap) { A.state.order = 1; A.redraw(); n.textContent = '14 / 14'; col.set('verified', true); return; }
    var tl = gsap.timeline({ delay: 0.3 });
    tl.to(A.state, { order: 1, duration: 3.4, ease: 'power2.inOut', onUpdate: A.redraw })
      .to(cnt, { v: 14, duration: 2.2, ease: 'none', snap: { v: 1 }, onUpdate: function () { n.textContent = pad(cnt.v) + ' / 14'; } }, 0.8)
      .call(function () { col.set('verified'); })
      .from('#ct', { yPercent: 30, autoAlpha: 0, duration: 0.9, ease: 'power3.out' }, 0.2);
  });
})();
</script>
</body>
</html>
